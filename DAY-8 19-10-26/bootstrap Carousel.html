<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bootstrap Carousel with Real Images</title>

        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet">

        <style>
        .carousel-item img{
            height: 500px;
            object-fit: cover;
        }
    </style>
    </head>
    <body>

        <div class="container mt-4">

            <div id="mySlider" class="carousel slide" data-bs-ride="carousel">

                <!-- Indicators -->
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#mySlider"
                        data-bs-slide-to="0" class="active"></button>
                    <button type="button" data-bs-target="#mySlider"
                        data-bs-slide-to="1"></button>
                    <button type="button" data-bs-target="#mySlider"
                        data-bs-slide-to="2"></button>
                </div>

                <!-- Slides -->
                <div class="carousel-inner">

                    <!-- Slide 1 -->
                    <div class="carousel-item active">
                        <img
                            src="https://images.unsplash.com/photo-1506744038136-46273834b3fb"
                            class="d-block w-100" alt="Nature">
                    </div>

                    <!-- Slide 2 -->
                    <div class="carousel-item">
                        <img
                            src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e"
                            class="d-block w-100" alt="Mountain">
                    </div>

                    <!-- Slide 3 -->
                    <div class="carousel-item">
                        <img
                            src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
                            class="d-block w-100" alt="Beach">
                    </div>

                </div>

                <!-- Previous Button -->
                <button class="carousel-control-prev" type="button"
                    data-bs-target="#mySlider" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                </button>

                <!-- Next Button -->
                <button class="carousel-control-next" type="button"
                    data-bs-target="#mySlider" data-bs-slide="next">
                    <span class="carousel-control-next-icon"></span>
                </button>

            </div>

        </div>

        <!-- Bootstrap JS -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
