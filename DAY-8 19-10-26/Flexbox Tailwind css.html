<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tailwind Flexbox Design</title>

        <!-- Tailwind CSS -->
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body
        class="bg-gradient-to-r from-purple-900 via-indigo-800 to-blue-900 min-h-screen flex items-center justify-center">

        <!-- Main Flex Container -->
        <div class="flex flex-wrap gap-8 justify-center items-center p-10">

            <!-- Card 1 -->
            <div
                class="bg-white/10 backdrop-blur-lg text-white w-72 p-6 rounded-3xl shadow-2xl hover:scale-105 transition duration-500">
                <img
                    src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1200&auto=format&fit=crop"
                    class="rounded-2xl h-40 w-full object-cover mb-4">

                <h1 class="text-2xl font-bold mb-2">Nature View</h1>
                <p class="text-gray-200 mb-4">
                    Beautiful mountain landscape with modern Tailwind Flexbox
                    design.
                </p>

                <button
                    class="bg-pink-500 hover:bg-pink-600 px-4 py-2 rounded-xl font-semibold">
                    Explore
                </button>
            </div>

            <!-- Card 2 -->
            <div
                class="bg-white/10 backdrop-blur-lg text-white w-72 p-6 rounded-3xl shadow-2xl hover:scale-105 transition duration-500">
                <img
                    src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?q=80&w=1200&auto=format&fit=crop"
                    class="rounded-2xl h-40 w-full object-cover mb-4">

                <h1 class="text-2xl font-bold mb-2">City Lights</h1>
                <p class="text-gray-200 mb-4">
                    Stylish flexbox layout with glowing modern background
                    effects.
                </p>

                <button
                    class="bg-cyan-500 hover:bg-cyan-600 px-4 py-2 rounded-xl font-semibold">
                    Discover
                </button>
            </div>

            <!-- Card 3 -->
            <div
                class="bg-white/10 backdrop-blur-lg text-white w-72 p-6 rounded-3xl shadow-2xl hover:scale-105 transition duration-500">
                <img
                    src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=1200&auto=format&fit=crop"
                    class="rounded-2xl h-40 w-full object-cover mb-4">

                <h1 class="text-2xl font-bold mb-2">Ocean Breeze</h1>
                <p class="text-gray-200 mb-4">
                    Responsive flexbox cards using Tailwind CSS with
                    glassmorphism.
                </p>

                <button
                    class="bg-yellow-500 hover:bg-yellow-600 px-4 py-2 rounded-xl font-semibold">
                    Visit
                </button>
            </div>

        </div>

    </body>
</html>
