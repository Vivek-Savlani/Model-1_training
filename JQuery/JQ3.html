<!DOCTYPE html>
<html>
    <head>
        <title>Delete Row using jQuery</title>

        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

        <style>
        table {
            width: 60%;
            margin: 20px auto;
            border-collapse: collapse;
            text-align: center;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background-color: lightblue;
        }

        button {
            padding: 5px 10px;
            background-color: red;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
    </head>

    <body>

        <table>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>City</th>
                <th>Action</th>
            </tr>

            <tr>
                <td>1</td>
                <td>Harsh</td>
                <td>Ahmedabad</td>
                <td><button class="deleteBtn">Delete</button></td>
            </tr>

            <tr>
                <td>2</td>
                <td>Vivek</td>
                <td>Surat</td>
                <td><button class="deleteBtn">Delete</button></td>
            </tr>

            <tr>
                <td>3</td>
                <td>Rahul</td>
                <td>Rajkot</td>
                <td><button class="deleteBtn">Delete</button></td>
            </tr>
        </table>

        <script>
        $(document).ready(function () {

            $(".deleteBtn").click(function () {

                $(this).closest("tr").remove();

            });

        });
    </script>

    </body>
</html>
