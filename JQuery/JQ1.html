<!DOCTYPE html>
<html>
    <head>
        <title>Zebra Stripes using jQuery</title>

        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

        <style>
        table {
            width: 50%;
            border-collapse: collapse;
            margin: 20px auto;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        .odd {
            background-color: #f2f2f2;
        }

        .even {
            background-color: #d9edf7;
        }
    </style>
    </head>

    <body>

        <table>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>City</th>
            </tr>

            <tr>
                <td>1</td>
                <td>Harsh</td>
                <td>Ahmedabad</td>
            </tr>

            <tr>
                <td>2</td>
                <td>Vivek</td>
                <td>Surat</td>
            </tr>

            <tr>
                <td>3</td>
                <td>Rahul</td>
                <td>Rajkot</td>
            </tr>

            <tr>
                <td>4</td>
                <td>Aman</td>
                <td>Vadodara</td>
            </tr>
        </table>

        <script>
        $(document).ready(function () {

            $("tr:odd").addClass("odd");
            $("tr:even").addClass("even");

        });
    </script>

    </body>
</html>
